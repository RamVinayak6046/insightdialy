name: WhatsApp Template Test

on:
  workflow_dispatch:

jobs:
  send-template:
    runs-on: ubuntu-latest

    steps:
      - name: Send WhatsApp template
        env:
          ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT_PHONE }}
        run: |
          curl -X POST \
            "https://graph.facebook.com/v25.0/${PHONE_NUMBER_ID}/messages" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"messaging_product\": \"whatsapp\",
              \"to\": \"${RECIPIENT}\",
              \"type\": \"template\",
              \"template\": {
                \"name\": \"jasper_market_order_confirmation\",
                \"language\": {
                  \"code\": \"en_US\"
                },
                \"components\": [
                  {
                    \"type\": \"body\",
                    \"parameters\": [
                      {
                        \"type\": \"text\",
                        \"text\": \"Vinayak\"
                      },
                      {
                        \"type\": \"text\",
                        \"text\": \"NEWS-001\"
                      },
                      {
                        \"type\": \"text\",
                        \"text\": \"Oct 5, 2026\"
                      }
                    ]
                  }
                ]
              }
            }"
